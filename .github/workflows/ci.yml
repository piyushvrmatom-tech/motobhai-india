name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov ruff
      - name: Lint
        run: ruff check backend/
      - name: Test
        run: pytest backend/tests -q --cov=backend.services.splitter --cov-fail-under=90
