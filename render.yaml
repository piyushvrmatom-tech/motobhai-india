services:
  - type: web
    name: motobhai-api
    runtime: python
    pythonVersion: "3.11.9"
    rootDir: .
    plan: free
    region: singapore
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        value: AIzaSyCoFuNciMBavkSggXA_JgJYue4OlKO9XF8
      - key: GMAPS_API_KEY
        sync: false
      - key: GOOGLE_ROUTES_API_KEY
        sync: false
      - key: SHEETS_WEBHOOK_URL
        sync: false
      - key: OTP_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_TEMPLATE_ID
        sync: false
      - key: FIRESTORE_CREDENTIALS_B64
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://motobhai-india.web.app
      - key: SHARE_BASE_URL
        value: https://motobhai-india.web.app
      - key: ENV
        value: production
