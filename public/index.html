<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0B0F" />
  <meta name="description" content="Plan motorcycle tours across India in 8 seconds — routes, fuel, stays, downloadable PDF." />
  <title>Moto Bhai — Plan your ride</title>

  <!-- Open Graph -->
  <meta property="og:title" content="Moto Bhai India" />
  <meta property="og:description" content="AI motorcycle touring planner for Indian riders." />
  <meta property="og:image" content="https://motobhai-india.web.app/og-default.png" />
  <meta property="og:url" content="https://motobhai-india.web.app" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="preconnect" href="https://motobhai-api.onrender.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/app.css" />
</head>

<body>
  <a class="skip-link" href="#plan-form">Skip to planner</a>

  <header class="topbar">
    <a href="/" class="brand">
      <span class="brand__logo" aria-hidden="true">▲</span>
      <span class="brand__name">Moto Bhai</span>
    </a>
    <nav class="topnav">
      <a href="#my-rides" class="topnav__link" data-action="my-rides">My Rides</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1 class="hero__title">Plan a ride.</h1>
      <p class="hero__sub">Five questions. Eight seconds. One trip you'll actually take.</p>
    </section>

    <form id="plan-form" class="plan-form" novalidate>
      <!-- 1. FROM -->
      <label class="field">
        <span class="field__label">From</span>
        <input
          id="from"
          name="from"
          type="text"
          autocomplete="off"
          spellcheck="false"
          inputmode="search"
          placeholder="Gurugram"
          required
          maxlength="120"
        />
      </label>

      <!-- 2. TO -->
      <label class="field">
        <span class="field__label">To</span>
        <input
          id="to"
          name="to"
          type="text"
          autocomplete="off"
          spellcheck="false"
          inputmode="search"
          placeholder="Manali"
          required
          maxlength="120"
        />
      </label>

      <!-- 3. DAYS -->
      <label class="field">
        <span class="field__label">Days <span class="field__hint" id="days-hint">3</span></span>
        <div class="slider-row">
          <input id="days" name="days" type="range" min="1" max="14" value="3" />
          <output for="days" class="slider-out" aria-live="polite">3</output>
        </div>
        <div class="km-ring" id="km-ring" hidden>
          <div class="km-ring__bar"><div class="km-ring__fill" style="--p: 0"></div></div>
          <p class="km-ring__caption">Average <strong id="km-avg">—</strong> km/day · soft ceiling 350</p>
        </div>
      </label>

      <!-- 4. BIKE -->
      <fieldset class="field">
        <legend class="field__label">Bike</legend>
        <div class="bike-carousel" role="radiogroup" aria-label="Choose a bike">
          <div class="bike-carousel__track" id="bike-track">
            <!-- populated by JS from /api/motorcycles -->
            <div class="bike-card bike-card--skeleton" aria-hidden="true"></div>
            <div class="bike-card bike-card--skeleton" aria-hidden="true"></div>
            <div class="bike-card bike-card--skeleton" aria-hidden="true"></div>
            <div class="bike-card bike-card--skeleton" aria-hidden="true"></div>
          </div>
          <button type="button" class="bike-card bike-card--other" id="bike-other" data-value="__other">
            <span class="bike-card__make">Other</span>
            <span class="bike-card__model">Type my bike</span>
          </button>
        </div>
        <input type="hidden" id="bike_id" name="bike_id" />
        <input
          id="bike_custom"
          name="bike_custom"
          type="text"
          placeholder="e.g. Vintage Yezdi 250"
          maxlength="80"
          hidden
        />
      </fieldset>

      <!-- 5. VIBE -->
      <fieldset class="field">
        <legend class="field__label">Vibe</legend>
        <div class="vibe-chips" role="radiogroup" aria-label="Riding vibe">
          <label class="chip">
            <input type="radio" name="vibe" value="chill" />
            <span class="chip__inner">
              <strong>Chill</strong>
              <small>Late starts, short days, scenic stops</small>
            </span>
          </label>
          <label class="chip">
            <input type="radio" name="vibe" value="standard" checked />
            <span class="chip__inner">
              <strong>Standard</strong>
              <small>6 AM starts, balanced pace</small>
            </span>
          </label>
          <label class="chip">
            <input type="radio" name="vibe" value="hardcore" />
            <span class="chip__inner">
              <strong>Hardcore</strong>
              <small>5 AM, max distance, basic stays</small>
            </span>
          </label>
        </div>
      </fieldset>

      <p class="form-error" id="form-error" hidden></p>
    </form>

    <!-- Itinerary view (revealed after plan returns) -->
    <section id="itinerary" class="itinerary" hidden>
      <header class="itinerary__head">
        <h2 id="itinerary-title" class="itinerary__title">—</h2>
        <p class="itinerary__meta">
          <span id="itinerary-km">— km</span> ·
          <span id="itinerary-days">— days</span> ·
          <span id="itinerary-fuel">₹—</span>
        </p>
      </header>

      <div class="day-swiper" id="day-swiper" role="list">
        <!-- day cards injected by JS -->
      </div>

      <div class="itinerary__actions">
        <button type="button" class="btn btn--secondary" id="btn-pdf">Download PDF</button>
        <button type="button" class="btn btn--secondary" id="btn-share">Copy share link</button>
        <a href="/" class="btn btn--ghost">Plan another</a>
      </div>

      <p class="share-toast" id="share-toast" hidden>Link copied</p>
    </section>
  </main>

  <!-- Sticky bottom CTA -->
  <div class="sticky-cta">
    <button type="submit" form="plan-form" class="btn btn--primary" id="cta">
      <span class="cta__text">Plan My Ride</span>
      <span class="cta__spinner" aria-hidden="true"></span>
    </button>
  </div>

  <footer class="footer">
    <p>Built for riders. <a href="https://motobhai-india.web.app">motobhai-india.web.app</a></p>
  </footer>

  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
