<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0B0F" />
  <title>Shared ride — Moto Bhai India</title>

  <meta property="og:title" content="A motorcycle ride · Moto Bhai" />
  <meta property="og:description" content="Plan your own ride at motobhai-india.web.app" />
  <meta property="og:image" content="https://motobhai-india.web.app/og-default.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/app.css" />
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand">
      <span class="brand__logo" aria-hidden="true">▲</span>
      <span class="brand__name">Moto Bhai</span>
    </a>
    <a href="/" class="topnav__link">Plan your own ride →</a>
  </header>

  <main>
    <section class="itinerary" id="itinerary" hidden>
      <header class="itinerary__head">
        <p style="color:var(--accent);font-size:13px;letter-spacing:0.08em;text-transform:uppercase;font-weight:700;margin:0">Shared ride</p>
        <h1 id="itinerary-title" class="itinerary__title" style="margin-top:6px">—</h1>
        <p class="itinerary__meta">
          <span id="itinerary-km">— km</span> ·
          <span id="itinerary-days">— days</span> ·
          <span id="itinerary-fuel"></span>
        </p>
      </header>

      <div class="day-swiper" id="day-swiper" role="list"></div>

      <div class="itinerary__actions">
        <a href="/" class="btn btn--primary" style="max-width:none;width:auto">Plan my own ride</a>
      </div>
    </section>

    <section id="error-state" hidden style="max-width:var(--maxw);margin:0 auto;padding:60px 20px;text-align:center">
      <h1 style="font-size:28px;margin:0 0 12px">Ride not found</h1>
      <p style="color:var(--text-1);margin:0 0 24px">This share link expired or never existed.</p>
      <a href="/" class="btn btn--primary" style="max-width:none;width:auto">Plan your own ride</a>
    </section>

    <section id="loading-state" style="max-width:var(--maxw);margin:0 auto;padding:60px 20px;text-align:center">
      <div style="width:36px;height:36px;border:3px solid var(--bg-3);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px"></div>
      <p style="color:var(--text-2);margin:0">Loading shared ride…</p>
    </section>
  </main>

  <script type="module">
    import { api } from "/assets/js/api.js";

    const $ = (s) => document.querySelector(s);
    const escape = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    function shortIdFromPath() {
      const m = location.pathname.match(/\/s\/([a-z0-9_]+)$/i);
      return m ? m[1] : null;
    }

    async function load() {
      const id = shortIdFromPath();
      if (!id) return showError();
      try {
        const trip = await api.share(id);
        render(trip);
      } catch (e) {
        showError();
      }
    }

    function render(trip) {
      $("#loading-state").hidden = true;
      $("#itinerary").hidden = false;
      const s = trip.summary || {};
      $("#itinerary-title").textContent = `${s.from} → ${s.to}`;
      $("#itinerary-km").textContent = `${Math.round(s.total_km || 0)} km`;
      $("#itinerary-days").textContent = `${s.total_days} days`;
      $("#itinerary-fuel").textContent = s.est_fuel_cost_inr ? `₹${s.est_fuel_cost_inr.toLocaleString("en-IN")} fuel` : "";
      const swiper = $("#day-swiper");
      swiper.innerHTML = "";
      for (const day of trip.days_plan || []) {
        const c = document.createElement("article");
        c.className = "day-card";
        c.innerHTML = `
          <div class="day-card__day">Day ${day.day}</div>
          <div class="day-card__route">${escape(day.from)} → ${escape(day.to)}</div>
          <div class="day-card__map">Route map · ${Math.round(day.km)} km</div>
          <div class="day-card__stat">
            <span><strong>${Math.round(day.km)}</strong> km</span>
            <span><strong>${day.eta_hours ?? "—"}</strong> hrs</span>
          </div>
          ${day.hotel_suggestion ? `<div class="day-card__hotel"><div class="day-card__hotel-name">${escape(day.hotel_suggestion.name)}</div><div style="color:var(--text-2);font-size:13px">${escape(day.hotel_suggestion.area || "")}</div></div>` : ""}
          ${day.bhai_tip ? `<div class="day-card__tip">${escape(day.bhai_tip)}</div>` : ""}
        `;
        swiper.appendChild(c);
      }
    }

    function showError() {
      $("#loading-state").hidden = true;
      $("#error-state").hidden = false;
    }

    load();
  </script>
</body>
</html>
